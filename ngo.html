<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Explore NGO information, areas of work, sectors and official links on NGOEffects."
  >

  <title>NGO Profile | NGOEffects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    /* =========================================================
       NGO PROFILE PAGE
    ========================================================= */

    :root {
      --profile-bg: #f4f7f4;
      --profile-card: #ffffff;
      --profile-dark: #07382d;
      --profile-dark-2: #0b493b;
      --profile-green: #149b6b;
      --profile-green-light: #dff2e9;
      --profile-border: #d9e2dc;
      --profile-muted: #708078;
      --profile-text: #10201a;
      --profile-soft: #eef3ef;
      --profile-shadow: 0 18px 50px rgba(5, 45, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--profile-bg);
      color: var(--profile-text);
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .profile-page {
      padding: 70px 0 110px;
    }

    .profile-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* =========================================================
       TOP NAV / BACK
    ========================================================= */

    .profile-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border: 1px solid var(--profile-border);
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: .04em;
      transition: .2s ease;
    }

    .profile-back:hover {
      border-color: var(--profile-green);
      transform: translateX(-2px);
    }

    .profile-page-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      color: var(--profile-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* =========================================================
       PROFILE HERO
    ========================================================= */

    .profile-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      min-height: 480px;
      border-radius: 28px;
      background: var(--profile-dark);
      box-shadow: var(--profile-shadow);
    }

    .profile-hero::before {
      content: "";
      position: absolute;
      width: 430px;
      height: 430px;
      right: -170px;
      top: -210px;
      border: 1px solid rgba(180, 235, 211, .15);
      border-radius: 50%;
    }

    .profile-hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      left: 44%;
      bottom: -190px;
      border: 1px solid rgba(180, 235, 211, .10);
      border-radius: 50%;
    }

    .profile-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px;
    }

    .profile-eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #9dd8bf;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .profile-eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72d6ad;
      box-shadow: 0 0 0 5px rgba(114,214,173,.08);
    }

    .profile-title-wrap {
      margin: 45px 0 35px;
    }

    .profile-title {
      margin: 0;
      max-width: 700px;
      color: white;
      font-size: clamp(38px, 5vw, 68px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 800;
    }

    .profile-location {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      color: #c4d8cf;
      font-size: 14px;
    }

    .location-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      color: #9dd8bf;
      font-size: 13px;
    }

    .profile-description {
      max-width: 650px;
      margin: 0;
      color: #b8ccc4;
      font-size: 15px;
      line-height: 1.8;
    }

    /* =========================================================
       HERO SIDE
    ========================================================= */

    .profile-hero-side {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 35px;
    }

    .profile-visual-card {
      position: relative;
      width: 100%;
      min-height: 350px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background:
        radial-gradient(circle at 70% 25%, rgba(61,180,135,.22), transparent 34%),
        linear-gradient(145deg, #0b4a3b, #062d25);
    }

    .profile-visual-grid {
      position: absolute;
      inset: 0;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .profile-visual-ring {
      position: absolute;
      width: 260px;
      height: 260px;
      right: -45px;
      top: -55px;
      border: 1px solid rgba(170,230,207,.25);
      border-radius: 50%;
    }

    .profile-visual-ring::after {
      content: "";
      position: absolute;
      inset: 30px;
      border: 1px solid rgba(170,230,207,.17);
      border-radius: 50%;
    }

    .profile-visual-number {
      position: absolute;
      top: 28px;
      left: 28px;
      color: #8ed1b5;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .profile-visual-main {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 30px;
    }

    .profile-visual-main span {
      display: block;
      margin-bottom: 9px;
      color: #86cdb0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .profile-visual-main strong {
      display: block;
      color: white;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    /* =========================================================
       SECTOR TAGS
    ========================================================= */

    .profile-sectors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 27px;
    }

    .profile-sector {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      color: #d3e5dd;
      background: rgba(255,255,255,.06);
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      letter-spacing: .04em;
    }

    /* =========================================================
       ACTIONS
    ========================================================= */

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
    }

    .profile-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .profile-btn-primary {
      background: #dff5e9;
      color: #07382d;
    }

    .profile-btn-primary:hover {
      background: white;
      transform: translateY(-2px);
    }

    .profile-btn-secondary {
      border: 1px solid rgba(255,255,255,.18);
      color: white;
      background: rgba(255,255,255,.06);
    }

    .profile-btn-secondary:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-2px);
    }

    /* =========================================================
       CONTENT GRID
    ========================================================= */

    .profile-content {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, .6fr);
      gap: 22px;
      margin-top: 22px;
    }

    .profile-main-column,
    .profile-side-column {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .profile-card {
      padding: 30px;
      border: 1px solid var(--profile-border);
      border-radius: 20px;
      background: var(--profile-card);
      box-shadow: 0 10px 30px rgba(5,45,34,.035);
    }

    .profile-card-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .profile-card-label span:first-child {
      color: var(--profile-green);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .profile-card-label span:last-child {
      color: #9ba9a3;
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
    }

    .profile-card h2 {
      margin: 0 0 13px;
      color: var(--profile-text);
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .profile-card p {
      margin: 0;
      color: #62716b;
      font-size: 14px;
      line-height: 1.8;
    }

    /* =========================================================
       INFO ROWS
    ========================================================= */

    .profile-info-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--profile-border);
    }

    .profile-info-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      padding: 17px 0;
      border-bottom: 1px solid var(--profile-border);
    }

    .profile-info-label {
      color: #84918c;
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .profile-info-value {
      color: var(--profile-text);
      font-size: 13px;
      line-height: 1.65;
    }

    /* =========================================================
       AREAS
    ========================================================= */

    .profile-area-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .profile-area {
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--profile-soft);
      color: #38564b;
      font-size: 11px;
      font-weight: 600;
    }

    /* =========================================================
       SNAPSHOT
    ========================================================= */

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .profile-stat {
      padding: 18px;
      border: 1px solid var(--profile-border);
      border-radius: 12px;
      background: #f8faf8;
    }

    .profile-stat strong {
      display: block;
      color: var(--profile-dark);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .profile-stat span {
      display: block;
      margin-top: 8px;
      color: #7b8983;
      font-family: "IBM Plex Mono", monospace;
      font-size: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* =========================================================
       OFFICIAL LINK CARD
    ========================================================= */

    .official-card {
      position: relative;
      overflow: hidden;
      background: var(--profile-dark);
      color: white;
    }

    .official-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -65px;
      bottom: -80px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
    }

    .official-card .profile-card-label span:first-child {
      color: #8bd3b3;
    }

    .official-card h2 {
      color: white;
    }

    .official-card p {
      color: #a9c1b7;
    }

    .official-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 22px;
      padding: 12px 15px;
      border-radius: 9px;
      background: #dff5e9;
      color: #07382d;
      font-size: 11px;
      font-weight: 800;
    }

    /* =========================================================
       NOTICE / ERROR
    ========================================================= */

    .profile-message {
      max-width: 720px;
      margin: 100px auto;
      padding: 50px 35px;
      border: 1px solid var(--profile-border);
      border-radius: 22px;
      background: white;
      text-align: center;
      box-shadow: var(--profile-shadow);
    }

    .profile-message-code {
      margin-bottom: 14px;
      color: var(--profile-green);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .1em;
    }

    .profile-message h1 {
      margin: 0 0 12px;
      font-size: 34px;
      letter-spacing: -.04em;
    }

    .profile-message p {
      margin: 0 auto 25px;
      max-width: 500px;
      color: var(--profile-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .profile-message-btn {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 17px;
      border-radius: 8px;
      background: var(--profile-dark);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================================
       SKELETON
    ========================================================= */

    .profile-loading {
      padding: 30px;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: #e4ebe7;
      border-radius: 8px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
      );
      animation: skeleton-loading 1.3s infinite;
    }

    .skeleton-lg {
      height: 55px;
      width: 55%;
      margin-bottom: 18px;
    }

    .skeleton-md {
      height: 18px;
      width: 35%;
      margin-bottom: 12px;
    }

    .skeleton-sm {
      height: 13px;
      width: 80%;
      margin-bottom: 9px;
    }

    @keyframes skeleton-loading {
      100% {
        transform: translateX(100%);
      }
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 900px) {

      .profile-hero {
        grid-template-columns: 1fr;
      }

      .profile-hero-side {
        padding: 0 30px 30px;
      }

      .profile-visual-card {
        min-height: 280px;
      }

      .profile-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {

      .profile-page {
        padding: 35px 0 70px;
      }

      .profile-shell {
        width: min(100% - 24px, 1180px);
      }

      .profile-topbar {
        align-items: flex-start;
      }

      .profile-page-label {
        display: none;
      }

      .profile-hero {
        border-radius: 18px;
      }

      .profile-hero-content {
        padding: 30px 23px;
      }

      .profile-title-wrap {
        margin: 35px 0 28px;
      }

      .profile-title {
        font-size: 42px;
      }

      .profile-description {
        font-size: 13px;
      }

      .profile-hero-side {
        padding: 0 20px 20px;
      }

      .profile-visual-card {
        min-height: 240px;
      }

      .profile-content {
        gap: 14px;
        margin-top: 14px;
      }

      .profile-main-column,
      .profile-side-column {
        gap: 14px;
      }

      .profile-card {
        padding: 22px;
        border-radius: 16px;
      }

      .profile-info-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .profile-stats {
        grid-template-columns: 1fr 1fr;
      }

      .profile-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body data-page="ngos">

  <!-- Existing global navbar -->
  <div data-nav></div>

  <main class="profile-page">

    <div class="profile-shell">

      <!-- TOP BAR -->
      <div class="profile-topbar">
        <a href="ngos.html" class="profile-back">
          ← Back to Explore NGOs
        </a>

        <span class="profile-page-label">
          NGOEFFECTS · NGO PROFILE
        </span>
      </div>

      <!-- PROFILE WILL BE INSERTED HERE -->
      <div id="ngo-profile">

        <!-- Initial loading state -->
        <div class="profile-message">
          <div class="profile-loading">

            <div class="skeleton skeleton-md"></div>
            <div class="skeleton skeleton-lg"></div>
            <div class="skeleton skeleton-sm"></div>
            <div class="skeleton skeleton-sm"></div>

          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- Existing global footer -->
  <div data-footer></div>


  <!-- Existing project data + global navigation/footer -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>


  <!-- =========================================================
       NGO PROFILE LOGIC
       Everything specific to this page stays here.
  ========================================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const container = document.getElementById("ngo-profile");

      /*
       * Read NGO ID from:
       *
       * ngo.html?id=ngo-001
       */
      const params = new URLSearchParams(window.location.search);
      const ngoId = params.get("id");


      /* -------------------------------------------------------
         HELPERS
      ------------------------------------------------------- */

      function escapeHTML(value) {

        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }


      function normaliseArray(value) {

        if (!value) {
          return [];
        }

        if (Array.isArray(value)) {
          return value.filter(Boolean);
        }

        return [value].filter(Boolean);
      }


      function safeURL(url) {

        if (!url) {
          return null;
        }

        try {

          const parsed = new URL(url, window.location.href);

          if (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
          ) {
            return parsed.href;
          }

        } catch (error) {
          return null;
        }

        return null;
      }


      /* -------------------------------------------------------
         FIND NGO DATA
      ------------------------------------------------------- */

      function getNGOList() {

        /*
         * data.js exposes the directory as:
         * window.NGOEffectsSeedData.ngos
         *
         * Use that real project structure first.
         */

        if (
          window.NGOEffectsSeedData &&
          Array.isArray(window.NGOEffectsSeedData.ngos)
        ) {
          return window.NGOEffectsSeedData.ngos;
        }


        /* Optional compatibility fallbacks */

        if (
          window.NGOEffects &&
          Array.isArray(window.NGOEffects.ngos)
        ) {
          return window.NGOEffects.ngos;
        }

        if (
          window.NGOEffects &&
          Array.isArray(window.NGOEffects.data)
        ) {
          return window.NGOEffects.data;
        }

        if (Array.isArray(window.ngos)) {
          return window.ngos;
        }

        if (Array.isArray(window.NGO_DATA)) {
          return window.NGO_DATA;
        }

        return [];
      }


      function findNGO(id) {

        const list = getNGOList();

        if (!list.length || !id) {
          return null;
        }

        return list.find(item => {

          return String(
            item.id ??
            item.ngoId ??
            item.slug ??
            ""
          ).toLowerCase() === String(id).toLowerCase();

        }) || null;
      }


      /* -------------------------------------------------------
         ERROR STATE
      ------------------------------------------------------- */

      function renderNotFound() {

        container.innerHTML = `

          <div class="profile-message">

            <div class="profile-message-code">
              NGOEFFECTS · 404
            </div>

            <h1>NGO not found.</h1>

            <p>
              The organisation you're looking for could not
              be found in the current NGO dataset.
            </p>

            <a
              href="ngos.html"
              class="profile-message-btn"
            >
              Explore NGOs
            </a>

          </div>

        `;
      }


      /* -------------------------------------------------------
         RENDER PROFILE
      ------------------------------------------------------- */

      function renderProfile(ngo) {

        const name =
          ngo.name ||
          ngo.title ||
          "Unnamed Organisation";


        const state =
          ngo.state ||
          ngo.location?.state ||
          "";


        const districts = normaliseArray(
          ngo.districts ||
          ngo.district ||
          ngo.locations
        );


        const sectors = normaliseArray(
          ngo.sectors ||
          ngo.sector
        );


        const description =
          ngo.description ||
          ngo.about ||
          ngo.summary ||
          "No organisation description is currently available.";


        const website =
          safeURL(
            ngo.website ||
            ngo.url ||
            ngo.officialWebsite
          );


        const contactPage =
          safeURL(
            ngo.contactPage ||
            ngo.contact ||
            ngo.contactUrl
          );


        const locationParts = [];

        if (districts.length) {
          locationParts.push(districts.join(", "));
        }

        if (state) {
          locationParts.push(state);
        }


        const locationText =
          locationParts.length
            ? locationParts.join(", ")
            : "Location information unavailable";


        document.title =
          `${name} | NGOEffects`;


        /* -----------------------------------------------------
           SECTOR HTML
        ----------------------------------------------------- */

        const sectorHTML = sectors.length

          ? sectors.map(sector => `
              <span class="profile-sector">
                ${escapeHTML(sector)}
              </span>
            `).join("")

          : `
              <span class="profile-sector">
                Sector information unavailable
              </span>
            `;


        /* -----------------------------------------------------
           AREA HTML
        ----------------------------------------------------- */

        const areaHTML = districts.length

          ? districts.map(area => `
              <span class="profile-area">
                ${escapeHTML(area)}
              </span>
            `).join("")

          : `
              <span class="profile-area">
                Location information unavailable
              </span>
            `;


        /* -----------------------------------------------------
           WEBSITE BUTTON
        ----------------------------------------------------- */

        const websiteButton = website

          ? `
            <a
              href="${escapeHTML(website)}"
              target="_blank"
              rel="noopener noreferrer"
              class="profile-btn profile-btn-primary"
            >
              Visit Official Website
              <span>↗</span>
            </a>
          `

          : "";


        /* -----------------------------------------------------
           CONTACT BUTTON
        ----------------------------------------------------- */

        const contactButton = contactPage

          ? `
            <a
              href="${escapeHTML(contactPage)}"
              target="_blank"
              rel="noopener noreferrer"
              class="profile-btn profile-btn-secondary"
            >
              Contact NGO
              <span>↗</span>
            </a>
          `

          : "";


        /* -----------------------------------------------------
           PROFILE HTML
        ----------------------------------------------------- */

        container.innerHTML = `

          <!-- ===============================================
               PROFILE HERO
          ================================================ -->

          <section class="profile-hero">

            <div class="profile-hero-content">

              <div>

                <div class="profile-eyebrow">

                  <span class="profile-eyebrow-dot"></span>

                  NGOEFFECTS · ORGANISATION PROFILE

                </div>


                <div class="profile-title-wrap">

                  <h1 class="profile-title">
                    ${escapeHTML(name)}
                  </h1>


                  <div class="profile-location">

                    <span class="location-icon">
                      +
                    </span>

                    <span>
                      ${escapeHTML(locationText)}
                    </span>

                  </div>

                </div>


                <p class="profile-description">
                  ${escapeHTML(description)}
                </p>


                <div class="profile-sectors">

                  ${sectorHTML}

                </div>


                <div class="profile-actions">

                  ${websiteButton}

                  ${contactButton}

                </div>

              </div>

            </div>


            <div class="profile-hero-side">

              <div class="profile-visual-card">

                <div class="profile-visual-grid"></div>

                <div class="profile-visual-ring"></div>


                <div class="profile-visual-number">
                  NGO PROFILE · ${escapeHTML(
                    String(ngo.id || "01")
                      .slice(-2)
                  )}
                </div>


                <div class="profile-visual-main">

                  <span>
                    DISCOVER · UNDERSTAND · CONNECT
                  </span>

                  <strong>
                    The work behind<br>
                    the impact.
                  </strong>

                </div>

              </div>

            </div>

          </section>


          <!-- ===============================================
               CONTENT
          ================================================ -->

          <div class="profile-content">


            <!-- =============================================
                 LEFT
            ============================================== -->

            <div class="profile-main-column">


              <!-- ABOUT -->

              <section class="profile-card">

                <div class="profile-card-label">

                  <span>
                    01 — ABOUT THE ORGANISATION
                  </span>

                  <span>
                    NGOEFFECTS
                  </span>

                </div>


                <h2>
                  About ${escapeHTML(name)}
                </h2>


                <p>
                  ${escapeHTML(description)}
                </p>

              </section>


              <!-- AREAS -->

              <section class="profile-card">

                <div class="profile-card-label">

                  <span>
                    02 — AREAS OF WORK
                  </span>

                  <span>
                    LOCATION
                  </span>

                </div>


                <h2>
                  Where the organisation works.
                </h2>


                <p>
                  Locations currently associated with
                  this organisation in the available dataset.
                </p>


                <div class="profile-area-list">

                  ${areaHTML}

                </div>

              </section>


              <!-- FOCUS AREAS -->

              <section class="profile-card">

                <div class="profile-card-label">

                  <span>
                    03 — FOCUS AREAS
                  </span>

                  <span>
                    SECTORS
                  </span>

                </div>


                <h2>
                  Areas of focus.
                </h2>


                <p>
                  Social sectors associated with this
                  organisation.
                </p>


                <div class="profile-area-list">

                  ${
                    sectors.length

                      ? sectors.map(sector => `
                          <span class="profile-area">
                            ${escapeHTML(sector)}
                          </span>
                        `).join("")

                      : `
                          <span class="profile-area">
                            Sector information unavailable
                          </span>
                        `
                  }

                </div>

              </section>


            </div>


            <!-- =============================================
                 RIGHT
            ============================================== -->

            <div class="profile-side-column">


              <!-- ORGANISATION INFO -->

              <section class="profile-card">

                <div class="profile-card-label">

                  <span>
                    PROFILE DATA
                  </span>

                  <span>
                    INFO
                  </span>

                </div>


                <div class="profile-info-list">


                  <div class="profile-info-row">

                    <span class="profile-info-label">
                      Organisation
                    </span>

                    <span class="profile-info-value">
                      ${escapeHTML(name)}
                    </span>

                  </div>


                  <div class="profile-info-row">

                    <span class="profile-info-label">
                      State
                    </span>

                    <span class="profile-info-value">
                      ${
                        escapeHTML(
                          state ||
                          "Not available"
                        )
                      }
                    </span>

                  </div>


                  <div class="profile-info-row">

                    <span class="profile-info-label">
                      Districts
                    </span>

                    <span class="profile-info-value">
                      ${
                        districts.length
                          ? escapeHTML(districts.join(", "))
                          : "Not available"
                      }
                    </span>

                  </div>


                  <div class="profile-info-row">

                    <span class="profile-info-label">
                      Sectors
                    </span>

                    <span class="profile-info-value">
                      ${
                        sectors.length
                          ? escapeHTML(sectors.join(", "))
                          : "Not available"
                      }
                    </span>

                  </div>


                </div>

              </section>


              <!-- SNAPSHOT -->

              <section class="profile-card">

                <div class="profile-card-label">

                  <span>
                    04 — SNAPSHOT
                  </span>

                  <span>
                    AVAILABLE DATA
                  </span>

                </div>


                <h2>
                  At a glance.
                </h2>


                <div class="profile-stats">


                  <div class="profile-stat">

                    <strong>
                      ${districts.length || "—"}
                    </strong>

                    <span>
                      AREAS LISTED
                    </span>

                  </div>


                  <div class="profile-stat">

                    <strong>
                      ${sectors.length || "—"}
                    </strong>

                    <span>
                      SECTORS
                    </span>

                  </div>


                </div>

              </section>


              <!-- OFFICIAL WEBSITE -->

              <section class="profile-card official-card">

                <div class="profile-card-label">

                  <span>
                    OFFICIAL SOURCE
                  </span>

                  <span>
                    05
                  </span>

                </div>


                <h2>
                  Verify & explore directly.
                </h2>


                <p>
                  For the latest information about this
                  organisation, visit its official website.
                </p>


                ${
                  website

                    ? `
                      <a
                        href="${escapeHTML(website)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="official-link"
                      >
                        Visit Official Website
                        <span>↗</span>
                      </a>
                    `

                    : `
                      <span
                        style="
                          display:inline-block;
                          margin-top:20px;
                          color:#8fa79e;
                          font-size:11px;
                        "
                      >
                        Official website not available
                        in the current dataset.
                      </span>
                    `
                }

              </section>


            </div>

          </div>

        `;

      }


      /* -------------------------------------------------------
         INITIALISE
      ------------------------------------------------------- */

      if (!ngoId) {

        renderNotFound();

        return;

      }


      /*
       * Give data.js a moment to expose its data.
       * This also prevents a blank page if data.js
       * finishes initialising after DOMContentLoaded.
       */

      let attempts = 0;

      const loadProfile = setInterval(() => {

        attempts++;

        const ngo = findNGO(ngoId);

        if (ngo) {

          clearInterval(loadProfile);

          renderProfile(ngo);

          return;
        }


        /*
         * Stop after approximately 3 seconds.
         */

        if (attempts >= 30) {

          clearInterval(loadProfile);

          renderNotFound();

        }

      }, 100);


    });

  </script>
</body>
</html>
